name: Schedule smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger info
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u
